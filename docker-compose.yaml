services:
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /data/pg_data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - postgres:/data/pg_data

  go-service:
    build:
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      REST_HOST: 0.0.0.0
      REST_PORT: 443
      TLS_PATH: /src/certs
    image: go-service-linux-arm64
    ports:
      - 8443:443
    networks:
      - postgres


volumes:
  postgres:
    driver: local
    name: postgres_data
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA}
  tls:
    driver: local
    name: certs
    driver_opts:
      type: none
      o: bind
      device: ${TLS_PATH}

networks:
  postgres:
    driver: bridge